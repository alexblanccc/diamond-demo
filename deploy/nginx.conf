limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name diamond-dent.kz www.diamond-dent.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://diamond-dent.kz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name diamond-dent.kz www.diamond-dent.kz;

    ssl_certificate     /etc/letsencrypt/live/diamond-dent.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamond-dent.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    limit_conn perip 30;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }

    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/diamond_proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/diamond_proxy.conf;
    }

    location / {
        limit_req zone=site burst=60 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/diamond_proxy.conf;
    }
}
