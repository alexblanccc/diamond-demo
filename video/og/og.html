<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1200px;height:630px;font-family:-apple-system,"SF Pro Display",Inter,sans-serif;background:linear-gradient(135deg,#e3f6f5,#f5fcfc 55%,#fff);display:grid;grid-template-columns:1fr 470px;overflow:hidden;color:#0f2c2d}
.l{padding:60px 0 50px 64px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:14px;align-items:center;font-size:30px;font-weight:800}.brand img{width:64px;height:64px;border-radius:50%}.brand small{display:block;font-size:18px;font-weight:500;color:#4d6f70}
h1{font-size:58px;line-height:1.05;letter-spacing:-.02em}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{background:#fff;border:1px solid #cfe7e5;border-radius:999px;padding:10px 18px;font-size:22px;font-weight:600}.chip b{color:#e5484d}
.rate{margin-top:auto;display:flex;gap:14px;align-items:center;font-size:24px;color:#2a4a4c}.rate b{font-size:44px;color:#0f2c2d}.stars{color:#f5b301;font-size:30px;letter-spacing:2px}
.r{position:relative}.r .ph{position:absolute;inset:36px 36px 36px 0;border-radius:32px;overflow:hidden;box-shadow:0 30px 60px rgba(10,80,78,.2)}.r img{width:100%;height:150%;object-fit:cover;object-position:center top;display:block}
</style></head><body>
<div class="l"><div class="brand"><img src="../../static/img/logo.jpg"><div>Diamond<small>стоматология в Павлодаре</small></div></div>
<h1>Здоровая улыбка сейчас, платите потом</h1>
<div class="chips"><span class="chip"><b>Kaspi</b> 0-0-24</span><span class="chip">Бесплатная консультация</span><span class="chip">Запись онлайн</span></div>
<div class="rate"><b>5.0</b><span class="stars">★★★★★</span><span>622 оценки в 2ГИС</span></div></div>
<div class="r"><div class="ph"><img src="../../static/img/post-clinic.jpg"></div></div>
</body></html>
